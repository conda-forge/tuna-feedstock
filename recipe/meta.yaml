{% set version = "0.5.13" %}

package:
  name: tuna
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/tuna/tuna-{{ version }}.tar.gz
  sha256: 2d2e69992d2030097be550a662815cad150218e7a42b732d37e27de4d745939c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  entry_points:
    - tuna = tuna.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    # While not strictly necessary for python 3.8 and above
    # it does make the package noarch if we simply include it without
    # a selector
    - importlib_metadata

test:
  commands:
    - tuna --help

about:
  home: https://github.com/nschloe/tuna
  license: MIT
  license_family: MIT
  # no license file included in source
  # https://github.com/nschloe/tuna/issues/36
  license_file: LICENSE
  summary: tuna is a Python profile viewer inspired by the amazing SnakeViz.

extra:
  recipe-maintainers:
    - hmaarrfk
